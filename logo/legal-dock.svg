<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset=".55" stop-color="#e83e8c"/><stop offset="1" stop-color="#5b2bd9"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#ffffff" stop-opacity=".22"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5ee7ff"/><stop offset="1" stop-color="#2f7bff"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff176"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dffb0"/><stop offset="1" stop-color="#14c46b"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd0e6"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1a0638" flood-opacity=".45"/></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="400" cy="96" r="150" fill="#ffffff" fill-opacity=".10"/>
  <!-- sparkles -->
  <g fill="#fff"><path d="M92 120l7 20 20 7-20 7-7 20-7-20-20-7 20-7z" opacity=".9"/><path d="M420 190l5 14 14 5-14 5-5 14-5-14-14-5 14-5z" opacity=".8"/><circle cx="150" cy="214" r="5" opacity=".7"/></g>
  <!-- bounce motion lines -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".75"><path d="M214 176v-34"/><path d="M256 168v-48"/><path d="M298 176v-34"/></g>
  <!-- dock glass pill -->
  <g filter="url(#sh)">
    <rect x="44" y="330" width="424" height="116" rx="58" fill="url(#glass)" stroke="#fff" stroke-opacity=".8" stroke-width="5"/>
  </g>
  <!-- small tiles -->
  <rect x="80" y="364" width="60" height="60" rx="16" fill="url(#t1)" filter="url(#sh)"/>
  <rect x="164" y="364" width="60" height="60" rx="16" fill="url(#t2)" filter="url(#sh)"/>
  <rect x="288" y="364" width="60" height="60" rx="16" fill="url(#t3)" filter="url(#sh)"/>
  <rect x="372" y="364" width="60" height="60" rx="16" fill="url(#t4)" filter="url(#sh)"/>
  <!-- magnified, bouncing middle tile: tiny Rubik face -->
  <g filter="url(#sh)">
    <rect x="198" y="200" width="116" height="116" rx="28" fill="#15151f"/>
    <g>
      <rect x="210" y="212" width="29" height="29" rx="7" fill="#ff3b30"/><rect x="241.5" y="212" width="29" height="29" rx="7" fill="#fff"/><rect x="273" y="212" width="29" height="29" rx="7" fill="#007aff"/>
      <rect x="210" y="243.5" width="29" height="29" rx="7" fill="#ffcc00"/><rect x="241.5" y="243.5" width="29" height="29" rx="7" fill="#34c759"/><rect x="273" y="243.5" width="29" height="29" rx="7" fill="#ff9500"/>
      <rect x="210" y="275" width="29" height="29" rx="7" fill="#fff"/><rect x="241.5" y="275" width="29" height="29" rx="7" fill="#ff3b30"/><rect x="273" y="275" width="29" height="29" rx="7" fill="#ffcc00"/>
    </g>
  </g>
  <!-- running dots -->
  <g fill="#fff"><circle cx="110" cy="436" r="4"/><circle cx="256" cy="438" r="0"/><circle cx="402" cy="436" r="4"/></g>
</svg>
