<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%"><stop offset="0" stop-color="#1b2a4a"/><stop offset="1" stop-color="#05070f"/></radialGradient>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="60" y1="60" x2="450" y2="450"><stop offset="0" stop-color="#37e6ff"/><stop offset="1" stop-color="#b66bff"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- gavel -->
  <g filter="url(#glow)" transform="rotate(38 256 210)">
    <rect x="248" y="170" width="20" height="150" rx="10" fill="url(#neon)"/>
    <rect x="176" y="96" width="164" height="84" rx="20" fill="none" stroke="url(#neon)" stroke-width="16"/>
    <path d="M214 96V180M302 96V180" stroke="url(#neon)" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- dock pill with magnified middle icon -->
  <g filter="url(#glow)">
    <rect x="76" y="360" width="360" height="82" rx="41" fill="#0b1226" fill-opacity=".9" stroke="url(#neon)" stroke-width="8"/>
    <rect x="112" y="384" width="38" height="38" rx="10" fill="none" stroke="#37e6ff" stroke-width="6"/>
    <rect x="224" y="368" width="64" height="64" rx="16" fill="url(#neon)"/>
    <rect x="362" y="384" width="38" height="38" rx="10" fill="none" stroke="#b66bff" stroke-width="6"/>
  </g>
</svg>
