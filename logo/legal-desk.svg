<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1470"/><stop offset=".6" stop-color="#110a2e"/><stop offset="1" stop-color="#06040e"/></linearGradient>
    <radialGradient id="neb1" cx="35%" cy="28%" r="45%"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".75"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="85%" cy="80%" r="40%"><stop offset="0" stop-color="#B061FF" stop-opacity=".5"/><stop offset="1" stop-color="#B061FF" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6E1FA" stop-opacity=".42"/><stop offset="1" stop-color="#8B5CF6" stop-opacity=".22"/></linearGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8EDCFF"/><stop offset="1" stop-color="#6C8CFF"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#CC8CFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E6E1FA"/><stop offset="1" stop-color="#B8A2FF"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#neb1)"/><rect width="512" height="512" fill="url(#neb2)"/>
    <!-- stars + constellation -->
    <g stroke="#fff" stroke-opacity=".3" stroke-width="1.4" fill="none"><path d="M60 70L130 40L190 88L130 120Z M400 60L450 110L420 160L372 120Z M70 250L40 310"/></g>
    <g fill="#fff"><circle cx="60" cy="70" r="3.2"/><circle cx="130" cy="40" r="3.6"/><circle cx="190" cy="88" r="3"/><circle cx="130" cy="120" r="3.2"/><circle cx="400" cy="60" r="3.2"/><circle cx="450" cy="110" r="3.6"/><circle cx="420" cy="160" r="3"/><circle cx="372" cy="120" r="3.2"/><circle cx="70" cy="250" r="2.8"/><circle cx="40" cy="310" r="2.4"/>
      <circle cx="250" cy="40" r="1.8" opacity=".8"/><circle cx="320" cy="90" r="1.6" opacity=".7"/><circle cx="90" cy="180" r="1.6" opacity=".7"/><circle cx="470" cy="250" r="1.8" opacity=".8"/><circle cx="300" cy="30" r="1.4" opacity=".6"/><circle cx="20" cy="150" r="1.4" opacity=".6"/><circle cx="490" cy="190" r="1.4" opacity=".6"/>
      <path d="M232 62l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" opacity=".9"/><path d="M355 200l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" opacity=".8"/></g>
    <!-- motion lines -->
    <g stroke="#E6E1FA" stroke-width="9" stroke-linecap="round" opacity=".7"><path d="M222 168v-30"/><path d="M256 160v-44"/><path d="M290 168v-30"/></g>
    <!-- hopping Rubik tile -->
    <g filter="url(#glow)"><rect x="196" y="186" width="120" height="120" rx="28" fill="#8B5CF6" opacity=".35"/></g>
    <g filter="url(#sh)">
      <rect x="196" y="186" width="120" height="120" rx="28" fill="#120b2b" stroke="#B8A2FF" stroke-opacity=".7" stroke-width="3"/>
      <g>
        <rect x="209" y="199" width="29" height="29" rx="7" fill="#8B5CF6"/><rect x="241.5" y="199" width="29" height="29" rx="7" fill="#E6E1FA"/><rect x="274" y="199" width="29" height="29" rx="7" fill="#6C8CFF"/>
        <rect x="209" y="231.5" width="29" height="29" rx="7" fill="#CC8CFF"/><rect x="241.5" y="231.5" width="29" height="29" rx="7" fill="#5CC8F5"/><rect x="274" y="231.5" width="29" height="29" rx="7" fill="#B061FF"/>
        <rect x="209" y="264" width="29" height="29" rx="7" fill="#E6E1FA"/><rect x="241.5" y="264" width="29" height="29" rx="7" fill="#8B5CF6"/><rect x="274" y="264" width="29" height="29" rx="7" fill="#B8A2FF"/>
      </g>
    </g>
    <!-- dock pill -->
    <g filter="url(#sh)"><rect x="52" y="326" width="408" height="84" rx="42" fill="url(#glass)" stroke="#E6E1FA" stroke-opacity=".75" stroke-width="4"/></g>
    <rect x="86" y="342" width="52" height="52" rx="14" fill="url(#t1)"/><rect x="156" y="342" width="52" height="52" rx="14" fill="url(#t2)"/>
    <rect x="304" y="342" width="52" height="52" rx="14" fill="url(#t3)"/><rect x="374" y="342" width="52" height="52" rx="14" fill="url(#t1)"/>
    <!-- label -->
    <text x="256" y="466" text-anchor="middle" font-family="Noto Sans, sans-serif" font-weight="900" font-size="26" letter-spacing="7" fill="#E6E1FA">LEGAL DESK</text>
  </g>
</svg>
